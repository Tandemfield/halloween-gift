<!DOCTYPE html>
<html lang="en">

<title>Boo Basket Experience · Tandemfield</title>
<style>
:root{--bg:#14101a;--bone:#f3ead8;--mut:#b9ad9c;--em:#d9894a;--wine:#6b2d3e;--card:#1f1827;--ln:#3a2f45}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(120% 55% at 50% 105%,rgba(217,137,74,.2),transparent 62%),var(--bg);color:var(--bone);font:17px/1.5 Georgia,'Times New Roman',serif;-webkit-text-size-adjust:100%;overflow-x:hidden}

h1,h2{font-weight:400;line-height:1.2;overflow-wrap:anywhere}
h1{font-size:34px}h2{font-size:28px}

.in{margin:auto 0;width:100%}
.fade{animation:up .7s both}

.ft{padding:10px 24px 16px;display:flex;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--em);color:#1a1118;font:600 17px system-ui,sans-serif;text-decoration:none;cursor:pointer;padding:0 16px}
.btn:disabled{opacity:.4;cursor:default}
.btn.g{background:transparent;color:var(--bone);border:1px solid var(--ln)}
.lnk{background:none;border:0;color:var(--em);font:15px system-ui,sans-serif;text-decoration:underline;min-height:48px;padding:0 8px;cursor:pointer}

.opt{display:block;width:100%;min-height:52px;margin:8px 0;background:var(--card);color:var(--bone);border:1px solid var(--ln);border-radius:12px;font:17px system-ui,sans-serif;text-align:left;padding:12px 16px;cursor:pointer}
.opt.ok{border-color:var(--em);background:#2b1f22}.opt.no{opacity:.45}
.opt b{display:block;font:400 21px Georgia,serif}.opt span{color:var(--mut);font-size:15px}
.seal{width:156px;height:156px;background:none;border:0;padding:0;margin:26px auto 8px;display:block;cursor:pointer;filter:drop-shadow(0 0 22px rgba(217,137,74,.45));animation:pulse 3s ease-in-out infinite}
.seal svg{width:100%;height:100%}
@keyframes pulse{50%{filter:drop-shadow(0 0 36px rgba(217,137,74,.75))}}
.flame{display:block;width:44px;margin:0 auto 14px;animation:fl 2.4s ease-in-out infinite;transform-origin:50% 100%;filter:drop-shadow(0 0 10px rgba(217,137,74,.7))}
@keyframes fl{50%{transform:scale(1.07,.94) rotate(-2deg)}}
.em{display:flex;gap:14px;justify-content:center;margin:14px 0}
.em i{width:14px;height:14px;border-radius:50%;background:var(--ln)}
.em i.on{background:var(--em);box-shadow:0 0 14px 3px rgba(217,137,74,.7)}
.fb{min-height:24px;color:var(--em);font:15px system-ui,sans-serif}
.pick{font-size:26px;margin:12px 0}
.gc{background:var(--card);border:1px solid var(--em);border-radius:16px;padding:26px 20px;min-height:150px;display:flex;align-items:center;justify-content:center;font-size:21px;margin:12px 0;overflow-wrap:anywhere}
.tell{margin-top:18px;text-align:left;width:100%}
.row{display:flex;gap:10px;margin-top:8px}.row .btn{min-height:52px}
.sg{flex:1;min-width:0;margin:0;text-align:center;font-size:16px}
.pv{background:var(--wine);font:600 13px system-ui,sans-serif;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 12px;min-height:48px}
.pv .lnk{color:var(--bone)}
.bm{align-items:stretch;text-align:left}
.bh{font:600 14px system-ui,sans-serif;color:var(--mut)}
.pg{height:3px;background:var(--ln)}.pg i{display:block;height:100%;background:var(--em)}
.fd{margin:16px 0}
label{display:block;font:600 14px system-ui,sans-serif;margin-bottom:6px}
input,textarea{width:100%;background:var(--card);color:var(--bone);border:1px solid var(--ln);border-radius:12px;padding:12px;font:17px system-ui,sans-serif;min-height:48px}
.rw{display:flex;justify-content:space-between;align-items:center}
.ct{color:var(--mut);font:13px system-ui,sans-serif}
.note{background:var(--card);border-radius:12px;padding:12px 14px;margin:14px 0;font:14px/1.5 system-ui,sans-serif;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------------- BUILDER ---------------- */
const LAB={n:['Their name','e.g. Jordan'],f:['Your name','e.g. Maya'],m:['Your message to them','Two or three sentences. Tap "Use a starter" if you want a head start.'],t:['Teaser line (optional)',DEF.t],c:['Your personal clue','An inside joke or memory that points toward the gift. Only the two of you should get it.'],g:['What the gift is','e.g. Tickets to the haunted trail, plus your favorite candy'],w:['Where or how to find it (optional)','e.g. Waiting in the fridge, behind the milk'],o1:['Open when you miss me',DEF.o1],o2:['Open when you need a laugh',DEF.o2],o3:['Open at midnight',DEF.o3],v:['Movie pick (optional)','Leave blank and they get a shuffle button'],x:['Final note under the gift (optional)',DEF.x],z:['Closing message (optional)',DEF.z]};
const ML={m:1,c:1,o1:1,o2:1,o3:1,x:1,z:1},REQ={n:1,f:1,m:1,c:1,g:1};
const STEPS=[null,['f','n'],['m'],['t','c','g','w'],['o1','o2','o3'],['v','x','z'],null,null];
const TT=['','Who is it from and for?','Your message','The hunt','Open when','Finishing touches'];
const HT=['','Pick one for each side. A group is just one name, like The Girls.','This is the first thing they read after the seal. Make it sound like you.','Clues 1 to 3 are done for you. Clue 4 is yours: make it personal. Then say what the gift is and where it is.','Three short envelopes. Leave any blank to use ours.','All optional. Skip any you like.'];
let D={},bs=0,sm=-1;
try{const x=JSON.parse(LS.g('tf_boo_draft')||'null');if(x){D=clean(x);['a','b'].forEach(k=>{if(D[k]!=='g')D[k]=''})}KEYS.forEach(k=>{if(!D[k])delete D[k]})}catch(e){D={}}
const saveD=()=>LS.s('tf_boo_draft',JSON.stringify(D));
const mk=()=>{const o={};KEYS.forEach(k=>{const v=(D[k]||'').trim();if(v)o[k]=v});return location.href.split('#')[0]+'#p='+enc(o)};
const nl=k=>{if(k!='n'&&k!='f')return DEF[k]?[LAB[k][0],dflt(k,D)]:LAB[k];const g=k=='f'?D.a=='g':D.b=='g',gr=D.a=='g'&&D.b=='g';return k=='f'?(g?[gr?'Your group name':'Group name','e.g. The Girls']:['Your name','e.g. Maya']):(g?[gr?'Their group name':'Group name','e.g. The Boys']:['Their name','e.g. Jordan'])};
const seg=()=>[['Who is it from?','a',['Just me','A group']],['Who is it for?','b',['One person','A group']]].map(q=>'<div class="fd"><label id="l_'+q[1]+'">'+q[0]+'</label><div class="row" role="group" aria-labelledby="l_'+q[1]+'">'+q[2].map((t,i)=>{const on=(D[q[1]]=='g')==(i==1);return '<button class="opt sg'+(on?' ok':'')+'" data-b="mode" data-k="'+q[1]+'" data-v="'+(i?'g':'')+'" aria-pressed="'+on+'">'+t+'</button>'}).join('')+'</div></div>').join('');
const fld=k=>{const L=nl(k),v=D[k]||'',st=k=='m'||DEF[k];return '<div class="fd"><label for="f_'+k+'">'+L[0]+'</label>'+(ML[k]?'<textarea id="f_'+k+'" data-k="'+k+'" maxlength="'+MAXL[k]+'" rows="4" placeholder="'+E(L[1])+'">'+E(v)+'</textarea>':'<input id="f_'+k+'" data-k="'+k+'" maxlength="'+MAXL[k]+'" placeholder="'+E(L[1])+'" value="'+E(v)+'" autocomplete="off">')+'<div class="rw"><span class="ct" id="c_'+k+'">'+v.length+'/'+MAXL[k]+'</span>'+(st?'<button class="lnk" data-b="st" data-k="'+k+'">Use a starter</button>':'')+'</div></div>'};
function chk(){const n=$('#bn');if(n&&STEPS[bs])n.disabled=!STEPS[bs].every(k=>!REQ[k]||(D[k]||'').trim())}
function renderB(){
let body;
if(bs==0)body='<h1>Turn their Boo Basket into an experience.</h1><p class="sub">Personalize it in about 8 minutes, preview it, then send one link. They open it on their phone and follow the clues to the gift.</p><div class="note">Only 5 fields are required. Nothing you type is sent to a server. Your draft is saved on this device only, and the finished link carries your message inside it.</div>'+(Object.keys(D).length?'<button class="lnk" data-b="clr">Clear my saved draft</button>':'');
else if(STEPS[bs])body='<h2>'+TT[bs]+'</h2><p class="mut">'+HT[bs]+'</p>'+(bs==1?seg():'')+STEPS[bs].map(fld).join('');
else if(bs==6)body='<h2>Preview</h2><p class="mut">See it exactly as they will. Nothing is sent.</p><button class="btn" data-b="prev">Preview the experience</button><p class="mut">Tap through every screen. It takes about three minutes.</p>';
else{const l=mk();body='<h2>Your surprise link</h2><p class="mut">Send this to them. They open it on their phone.</p><label for="lk">Link</label><textarea id="lk" readonly rows="4">'+E(l)+'</textarea><div class="row"><button class="btn" data-b="copy">Copy link</button>'+(navigator.share?'<button class="btn g" data-b="share">Share</button>':'')+'</div><div class="row"><a class="btn g" href="'+E(l)+'" target="_blank" rel="noopener">Open it like they will</a></div>'+(l.length>3500?'<div class="note">This link is long. If a chat app cuts it off, shorten a message or two.</div>':'')+'<div class="note"><b>About this link:</b> your names and messages are packed inside the link itself. This page stores nothing on a server. Anyone who has the link can read what is inside, so send it only to them. It is not encrypted. Save the link: this page cannot recover it later.</div><div class="note">Tips: open the link yourself first. Text it with "Open this on your phone 👻". Send it the moment you hand over the basket, lights low.</div>'}
$('#b').innerHTML='<div class="bar bh"><span>Boo Basket Experience</span><span>Step '+(bs+1)+' of 8</span></div><div class="pg"><i style="width:'+((bs+1)/8*100)+'%"></i></div><main class="sc bm"><div class="in">'+body+'</div></main><div class="ft">'+(bs?'<button class="btn g" data-b="bk">Back</button>':'')+(bs<7?'<button class="btn" id="bn" data-b="nx">'+(bs?'Next':'Start')+'</button>':'')+'</div>';
chk();$('#b .sc').scrollTop=0}
$('#b').addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;D[k]=e.target.value;const c=$('#c_'+k);if(c)c.textContent=D[k].length+'/'+MAXL[k];saveD();chk()});
$('#b').addEventListener('click',e=>{const t=e.target.closest('[data-b]');if(!t)return;const a=t.dataset.b;
if(a=='nx'&&bs<7){bs++;renderB()}
else if(a=='bk'&&bs>0){bs--;renderB()}
else if(a=='st'){const k=t.dataset.k;const A=D.a=='g'?STG:STM;if(k=='m'){sm=(sm+1)%A.length;D.m=sb(A[sm],D)}else D[k]=sb(dflt(k,D),D);const f=$('#f_'+k);f.value=D[k];const c=$('#c_'+k);c.textContent=D[k].length+'/'+MAXL[k];saveD();chk()}
else if(a=='mode'){const k=t.dataset.k,v=t.dataset.v;v?D[k]='g':delete D[k];saveD();renderB();const nb=$('[data-b="mode"][data-k="'+k+'"][data-v="'+v+'"]');if(nb)nb.focus()}
else if(a=='clr'){D={};LS.d('tf_boo_draft');renderB()}
else if(a=='prev'){startP(Object.assign({},D),true)}
else if(a=='copy')copy($('#lk').value,t,$('#lk'));
else if(a=='share'){(async()=>{try{await navigator.share({text:'Open this on your phone 🕯️',url:$('#lk').value})}catch(x){}})()}});
/* ---------------- BOOT ---------------- */
const m=location.hash.match(/^#p=([\w-]+)/);
if(m){const d=dec(m[1]);if(d&&typeof d.n==='string'&&d.n&&typeof d.f==='string'&&d.f)startP(d,false,m[1]);else{document.title="You've been Boo'd 🕯️";$('#p').hidden=false;$('#p').innerHTML='<main class="sc"><div class="in"><h2>This link looks incomplete.</h2><p class="sub">Part of it may have been cut off. Ask the sender to copy and send the full link again.</p></div></main>'}}
else{$('#b').hidden=false;renderB()}
})();
</script>
</body>
